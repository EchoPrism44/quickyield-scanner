name: Weekly grade snapshot

# Public grade ledger: every Monday, grade all live pools and commit a dated
# JSON to the repo. The git history is a tamper-proof, survivorship-bias-free
# record — each grade is timestamped before its outcome is known. No DB, no cost.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Grade all live pools
        run: npx -y tsx scripts/snapshot-grades.ts
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grades
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "chore(ledger): weekly grade snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
