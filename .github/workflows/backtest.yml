name: Risk model backtest

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run composite backtest
        run: npm run backtest:risk
      - name: Run component and baseline comparison
        run: npm run backtest:components
