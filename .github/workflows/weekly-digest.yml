name: Weekly digest

on:
  schedule:
    - cron: '30 8 * * 0' # Sundays 08:30 UTC (after the Vercel attempt)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.DIGEST_URL }}" ]; then
            echo "Error: DIGEST_URL secret is not set"
            echo "Please set DIGEST_URL in repository settings (e.g., https://getlitmus.xyz/api/cron/weekly-digest)"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Error: CRON_SECRET secret is not set"
            echo "Please set CRON_SECRET in repository settings (must match the CRON_SECRET env var on Vercel)"
            exit 1
          fi

      - name: Trigger digest endpoint
        env:
          DIGEST_URL: ${{ secrets.DIGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DIGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "DIGEST_URL / CRON_SECRET secrets not set — skipping."
            exit 0
          fi
          status=$(curl -s -o /tmp/digest.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$DIGEST_URL")
          echo "HTTP $status"
          cat /tmp/digest.json
          [ "$status" = "200" ]