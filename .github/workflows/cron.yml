name: Hourly yield scan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan-yields endpoint
        run: |
          curl -X GET "https://quickyield-scanner.vercel.app/api/cron/scan-yields?secret=${{ secrets.CRON_SECRET }}" \
            --fail --silent --show-error
