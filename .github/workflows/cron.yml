name: Hourly yield scan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan-yields endpoint
        run: |
          response=$(curl -X GET "https://quickyield-scanner.vercel.app/api/cron/scan-yields?secret=${{ secrets.CRON_SECRET }}" \
            --silent --show-error --max-time 60 --write-out "\n%{http_code}")
          body=$(printf "%s" "$response" | sed '$d')
          status=$(printf "%s" "$response" | tail -n 1)
          printf "%s\n" "$body"
          test "$status" -ge 200 -a "$status" -lt 300
