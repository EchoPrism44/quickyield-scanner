<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Litmus">
  <defs>
    <radialGradient id="tile" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="60%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0ece1"/>
      <stop offset="100%" stop-color="#dfd7c6"/>
    </linearGradient>
  </defs>
  <!-- Full bleed: X, Discord and Telegram crop avatars to a circle.
       Scale 1.59 keeps the whole mark inside that circle with margin. -->
  <rect width="400" height="400" fill="url(#tile)"/>
  <g fill="url(#metal)" transform="translate(200 200) scale(1.59) translate(-256 -169)">
    <path d="M 211,136 L 219,128 L 219,230 L 273,230 L 265,238 L 211,238 Z"/>
    <path d="M 225,122 L 233,114 L 233,216 L 287,216 L 279,224 L 225,224 Z"/>
    <path d="M 239,108 L 247,100 L 247,202 L 301,202 L 293,210 L 239,210 Z"/>
  </g>
</svg>
