<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Litmus">
  <defs>
    <linearGradient id="sweep" x1="192" y1="280" x2="352" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="0.55" stop-color="#3FD9C4"/>
      <stop offset="1" stop-color="#2F88FF"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: survives the circular crop X/Discord/Telegram apply.
       The mark sits inside the safe circle, so nothing important is clipped. -->
  <rect x="0" y="0" width="400" height="400" fill="#0c0f17"/>
  <!-- centred on the mark's true centre (57, 50.5), not the viewBox centre -->
  <g transform="translate(200 200) scale(3.1) translate(-57 -50.5)">
    <path d="M 28 18 h 15 v 50 h 30 v 15 H 28 Z" fill="#F5F6F8"/>
    <path d="M 49 68 L 86 19 L 70 68 Z" fill="url(#sweep)"/>
  </g>
</svg>
