<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Litmus">
  <defs>
    <linearGradient id="litmusSweep" x1="48" y1="70" x2="88" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="0.55" stop-color="#3FD9C4"/>
      <stop offset="1" stop-color="#2F88FF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="#0c0f17"/>
  <!-- L: upright + foot -->
  <path d="M 28 18 h 15 v 50 h 30 v 15 H 28 Z" fill="#F5F6F8"/>
  <!-- sweep: reads as the tick of a passed test, and as the strip lifting out -->
