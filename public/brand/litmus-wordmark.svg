<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Litmus">
  <defs>
    <linearGradient id="wmSweep" x1="48" y1="70" x2="88" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E676"/>
      <stop offset="0.55" stop-color="#3FD9C4"/>
      <stop offset="1" stop-color="#2F88FF"/>
    </linearGradient>
  </defs>
  <!-- Horizontal lockup: mark + wordmark. Transparent background so it drops
       onto any surface; swap the text fill to #0c0f17 for light backgrounds. -->
  <g transform="translate(4 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#0c0f17"/>
    <path d="M 28 18 h 15 v 50 h 30 v 15 H 28 Z" fill="#F5F6F8"/>
    <path d="M 49 68 L 86 19 L 70 68 Z" fill="url(#wmSweep)"/>
  </g>
  <text x="132" y="78" fill="#F5F6F8"
        font-family="Instrument Sans, Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="58" font-weight="600" letter-spacing="10">LITMUS</text>
</svg>
